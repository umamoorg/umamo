# Continuous integration: runs the shared verification suite on every push/PR.
# The suite itself lives in verification.yml so release.yml can run the identical thing — see the
# comment at the top of that file for why it is factored out rather than inlined here.
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege default: checkout is all this workflow needs. GitHub reports each
# job's pass/fail as a PR status check natively, no extra `checks`/`statuses` scope required.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Skip draft PRs to avoid burning runner minutes on WIP; ready_for_review re-triggers it.
    # This guard lives here rather than in verification.yml because the release workflow calls the
    # same suite with no pull-request context at all.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/verification.yml
    permissions:
      contents: read
